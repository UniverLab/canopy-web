# remote.univerlab.org — blind signaling relay
#
# One Worker, one job: prove both ends belong to the same GitHub account
# and forward opaque signaling messages between them, storing nothing.
# The Worker never parses signaling bodies beyond `t` for the rate limit
# (contract: Intelligence d4eb8558).
name = "canopy-remote"
main = "src/index.ts"
compatibility_date = "2026-10-26"

# Inlined on purpose: the account has a single Worker account, and the deploy
# workflow then needs exactly one secret (CLOUDFLARE_API_TOKEN).
account_id = "d7b81bdd721f503968523dd903d967be"

routes = [{ pattern = "remote.univerlab.org/*", zone_name = "univerlab.org" }]

# Serve the built browser app from apps/remote/web/dist on the same origin,
# so the page and its WebSocket share remote.univerlab.org. Paths matching
# `run_worker_first` always reach the Worker code first; everything else
# tries the assets first and an asset miss falls through to the Worker,
# which serves the agent discovery files (/llms.txt, /sitemap.xml, the
# well-known catalogue, ARD manifest and skills), serves index.html for
# extensionless navigation (the SPA fallback, or the markdown summary when
# asked) and answers 404 for unknown well-known probes and for file paths
# no built asset holds. There is deliberately no `not_found_handling`: the
# fallback lives in the Worker so unknown files 404 honestly instead of
# claiming to exist with 200 HTML.
[assets]
directory = "../web/dist"
binding = "ASSETS"
# "/" rides with the Worker even though an asset holds it: the document the
# scanner reads must carry the agent Link header and answer markdown when
# asked, and only the Worker adds either. The bytes stay the asset's.
run_worker_first = ["/", "/auth/*", "/ws/*", "/turn", "/.well-known/*"]

# One room per GitHub user id. The room uses the WebSocket hibernation API
# with per-socket attachments only — it never touches the storage API.
[[durable_objects.bindings]]
name = "USER_ROOM"
class_name = "UserRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserRoom"]
