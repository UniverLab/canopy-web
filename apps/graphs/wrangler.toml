# graphs.univerlab.org — install redirector
#
# One Worker, one job: answer Canopy's install request with a 302 to the
# document on GitHub, and count the request in aggregate. The Worker never
# proxies the document, so GitHub stays the download origin and the trust
# anchor (contract: Intelligence 778242cb).
name = "canopy-graphs"
main = "src/index.ts"
compatibility_date = "2026-10-26"

# Inlined on purpose: the account has a single Worker account, and the deploy
# workflow then needs exactly one secret (CLOUDFLARE_API_TOKEN).
account_id = "d7b81bdd721f503968523dd903d967be"

# The domain attached by API on 2026-10-27, declared in config.
routes = [{ pattern = "graphs.univerlab.org", custom_domain = true }]

[vars]
# The Analytics Engine account the downloads API reads; the SQL API is the
# only consumer. The token arrives as a secret (CF_ANALYTICS_TOKEN), the
# token for GitHub arrives as GITHUB_TOKEN.
CF_ACCOUNT_ID = "d7b81bdd721f503968523dd903d967be"
# The index-time model review: "Muse" enables the pass, "off" disables it
# entirely with indexing unaffected. The model id the badge names and the
# per-run scan cap; the Muse key arrives as a secret (CLAUDE_API_KEY).
REVIEW_PROVIDER = "off"
REVIEW_MODEL = "claude-haiku-4-5-20251001"
REVIEW_SCAN_CAP = "5"

# Aggregate counting. Analytics Engine is the right store: writes are
# fire-and-forget (no latency added to the redirect), there is no database to
# provision, and it is built for high-volume, low-value events. KV would need
# read-modify-write and rate-limits at 1 write/sec/key; D1 would put a SQL
# write in the hot path of every install.
#
# REQUIRED FIRST: Analytics Engine must be enabled once on the account, at
# dash.cloudflare.com → Storage & databases → Analytics Engine (NOT under
# Compute/Workers, despite what the error message links to). Until it is, a
# deploy that declares this binding fails with `code: 10089`, whatever the
# token's permissions. The dataset itself needs no provisioning — it is
# created on the first write; the dashboard's "Create Dataset" button is not
# needed.
#
# The binding is optional in code: `wrangler dev` without it still serves.
[[analytics_engine_datasets]]
binding = "INSTALLS"
dataset = "canopy_graph_installs"

# The scheduled catalogue index: a Cron Trigger rebuilds it every 15
# minutes (triggers below) and every page and API answer is served from
# it, so traffic never spends GitHub quota. Namespace canopy-graphs-index.
[[kv_namespaces]]
binding = "INDEX"
id = "14f08f7af605474585288b2169d80d9b"

# The drafts namespace: short-lived documents somebody shared without a
# repository. TTL 1800 (drafts.ts) and the first install deletes the key.
# Namespace canopy-graphs-drafts.
[[kv_namespaces]]
binding = "DRAFTS"
id = "e2fde572c17a4abba6b55645f7fc969a"

# The draft limiter: at most 10 drafts per minute per client IP, keyed on
# CF-Connecting-IP. Optional in code — `wrangler dev` without it serves
# unlimited drafts, like the tests do.
[[ratelimits]]
name = "DRAFT_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# The index build, every 15 minutes. The schedule is mirrored by
# INDEX_CRON in src/indexer.ts, which tells the pages what to promise.
[triggers]
crons = ["*/15 * * * *"]

# The static assets: the shared look kit (packages/look), copied into
# public/look by `npm run build:look`, and the graph editor bundle,
# built into public/editor by `npm run build:editor`. The pages are
# rendered strings, so only those two directories live on disk.
# `run_worker_first` keeps the JSON API and the install redirector in
# the Worker; every other request tries the assets first and an asset
# miss falls through to the Worker, which is exactly the catalogue's
# route table (/, /search, /g, /n, /d, /llms.txt, /publish, /editor,
# /robots.txt, /sitemap.xml, /.well-known/api-catalog, /api/openapi.json).
[assets]
directory = "public"
run_worker_first = ["/api/*", "/i/*"]
