name: release

# Run by hand on main. One version for both subdomains: the version in
# package.json names one tag, and graphs.univerlab.org and remote.univerlab.org
# deploy together from it. CI runs again on main, then both Workers deploy, and
# the tag and GitHub release come last, so a tag always names something that
# really shipped. To release again, bump the version in package.json by PR.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Release from main only
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases run from main, not $GITHUB_REF."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read the version and refuse a released one
        id: version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag is already released. Bump the version in package.json first."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  deploy-graphs:
    needs: ci
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  deploy-remote:
    needs: ci
    uses: ./.github/workflows/deploy-remote.yml
    secrets: inherit

  release:
    name: Tag and GitHub release
    needs: [version, deploy-graphs, deploy-remote]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
